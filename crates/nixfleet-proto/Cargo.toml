[package]
name = "nixfleet-proto"
description = "NixFleet v0.2 boundary-contract types (CONTRACTS.md §I)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "nixfleet_proto"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# Struct-level `#[skip_serializing_none]` to drop per-field
# `skip_serializing_if = "Option::is_none"` boilerplate.
serde_with = { workspace = true }
# host_key module: OpenSSH ed25519 pubkey parser + PKCS#8 wrapper +
# fingerprint helper. Both deps are pure-rust, no I/O. Avoids pulling
# the heavier `ssh-key` crate into the boundary-contract surface.
base64 = { workspace = true }
sha2 = { workspace = true }
# Optional: ToSql/FromSql for HostRolloutState - only the CP enables it.
rusqlite = { workspace = true, optional = true }

[features]
rusqlite = ["dep:rusqlite"]
# `testing` exposes nixfleet_proto::testing::FleetBuilder and friends  -
# fluent fixture construction shared across reconciler/CP/release tests.
testing = []
# `test-helpers` exposes `RolloutId::from_raw_for_tests` for callers
# that need to forge a `RolloutId` without going through the canonical
# `RolloutId::new(channel, channel_ref)` constructor. Same convention
# as `nixfleet_reconciler::Verified::unverified_for_tests` per
# RFC-0009 §3 + the RFC-0012 §6.3 amendment `0320c2fa`. Production
# builds MUST NOT enable this — the type-level enforcement of the
# canonical `"{channel}@{channel_ref}"` format is the contract.
test-helpers = []

[dev-dependencies]
nixfleet-canonicalize = { path = "../nixfleet-canonicalize" }
anyhow = { workspace = true }
